# 公共配置文件
spring:
  profiles:
    active: "dev"
  application:
    name: tongpin-backend
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yupi?rewriteBatchedStatements=true
    username: root
    password: a1357924680
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
  # session 失效时间
  session:
    timeout: 86400
    store-type: redis
  redis:
    host: localhost
    port: 6379
    database: 1
    password: a1357924680
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        domain: localhost
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
knife4j:
  enable: true
  openapi:
    title: 同频匹配系统
    description: 一个匹配交友系统
    email: 2302181496@qq.com
    concat: zjz
    url: https://docs.xiaominfo.com
    version: v4.0
    license: Apache 2.0
    license-url: https://stackoverflow.com/
    terms-of-service-url: https://stackoverflow.com/
    group:
      test1:
        group-name: 分组名称
        api-rule: package
        api-rule-resources:
          - com.zjz.tongpin.controller

  production: false

# 生产环境配置
---
spring:
  config:
    activate:
      on-profile: prod
knife4j:
  enable: true
  production: true   # 生产环境隐藏调试功能
  openapi:
    title: 同频匹配系统-生产环境

